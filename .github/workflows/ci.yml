name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@just
      - name: Run contributor checks
        run: just ci

  windows-installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Run native Windows installer fixtures
        shell: pwsh
        run: ./scripts/tests/install-forge-release.ps1
