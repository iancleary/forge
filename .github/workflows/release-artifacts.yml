name: Release Artifacts
run-name: Release ${{ inputs.version }} from ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Phoenix-date CalVer to publish
        required: true
        type: string
      target_sha:
        description: Full release commit SHA
        required: true
        type: string
      latest:
        description: Mark the release as latest
        required: true
        default: true
        type: boolean
      notes:
        description: Optional curated release notes
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_sha }}
      - name: Validate release inputs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]{8}\.0\.[0-9]+$ ]] || {
            echo "version must match YYYYMMDD.0.N"
            exit 1
          }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "target_sha must be a full commit SHA"
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "target_sha must be on main"
            exit 1
          }
          while IFS= read -r manifest; do
            manifest_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -n 1)"
            [ "$manifest_version" = "$RELEASE_VERSION" ] || {
              echo "$manifest must have version $RELEASE_VERSION, got $manifest_version"
              exit 1
            }
          done < <(find crates -mindepth 2 -maxdepth 2 -name Cargo.toml -print | sort)

  checks:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@just
      - name: Run contributor checks
        run: just ci

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Release Artifact
        id: artifact
        shell: bash
        run: |
          scripts/build-forge-release-artifact.sh \
            --version "${{ inputs.version }}" \
            --target "${{ matrix.target }}" \
            --output-dir dist
          echo "name=forge-${{ inputs.version }}-${{ matrix.target }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Attest Release Artifact
        id: attest_artifact
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ steps.artifact.outputs.name }}
      - name: Save Artifact Attestation Bundle
        shell: bash
        run: |
          cp \
            "${{ steps.attest_artifact.outputs.bundle-path }}" \
            "dist/${{ steps.artifact.outputs.name }}.attestation.json"
      - name: Upload Build Outputs
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Build Release Manifest
        shell: bash
        run: |
          scripts/build-forge-release-manifest.sh \
            --version "${{ inputs.version }}" \
            --artifacts-dir dist
      - name: Attest Release Metadata
        id: attest_metadata
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/forge-release-manifest.json
            dist/forge-release-sha256sums.txt
      - name: Save Metadata Attestation Bundle
        shell: bash
        run: |
          cp \
            "${{ steps.attest_metadata.outputs.bundle-path }}" \
            dist/forge-release-metadata.attestation.json
      - name: Verify staged attestations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.target_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            asset_name="forge-${RELEASE_VERSION}-${target}.tar.gz"
            if [ ! -f "dist/$asset_name" ]; then
              echo "missing release asset for verification: dist/$asset_name"
              exit 1
            fi
            for attempt in 1 2 3; do
              if gh attestation verify "dist/$asset_name" \
                --repo "${{ github.repository }}" \
                --source-ref "refs/heads/main" \
                --source-digest "$RELEASE_SHA" \
                --signer-workflow "${{ github.repository }}/.github/workflows/release-artifacts.yml" \
                --predicate-type https://slsa.dev/provenance/v1; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "failed to verify attestation for dist/$asset_name"
                exit 1
              fi
              sleep "$((attempt * 2))"
            done
          done

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_LATEST: ${{ inputs.latest }}
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_SHA: ${{ inputs.target_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          release_args=(
            "$RELEASE_VERSION"
            --target "$RELEASE_SHA"
            --title "$RELEASE_VERSION"
          )
          release_args+=(
            dist/*.tar.gz
            dist/*.attestation.json
            dist/forge-release-manifest.json
            dist/forge-release-sha256sums.txt
          )
          if [ -n "$RELEASE_NOTES" ]; then
            release_args+=(--notes "$RELEASE_NOTES")
          else
            release_args+=(--generate-notes)
          fi
          if [ "$RELEASE_LATEST" = "true" ]; then
            release_args+=(--latest)
          else
            release_args+=(--latest=false)
          fi
          gh release create "${release_args[@]}"
